name: SnapIt
options:
  bundleIdPrefix: com.kennyedward
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

targets:
  SnapIt:
    type: application
    platform: macOS
    sources:
      - path: SnapIt
        excludes:
          - "Resources/Info.plist"
          - "Resources/SnapIt.entitlements"
    settings:
      base:
        INFOPLIST_FILE: SnapIt/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SnapIt/Resources/SnapIt.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.kennyedward.snapit
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
